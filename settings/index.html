<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link rel="icon" href="../icon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Manrope:wght@200..800&display=swap" rel="stylesheet">
    <title>Peerya - Settings</title>
    <link href="https://cdn.jsdelivr.net/npm/halfmoon@2.0.2/css/halfmoon.min.css" rel="stylesheet" integrity="sha256-RjeFzczeuZHCyS+Gvz+kleETzBF/o84ZRHukze/yv6o=" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <style>
      :root {
        --peerya-green: #8bc34a;
        --peerya-green-dark: #7cb342;
        --peerya-ink: #2f2f2f;
        --peerya-muted: #6f6f6f;
        --peerya-line: #ececec;
        --peerya-soft: #f6f7f4;
        --bs-sidebar-width: 17.5rem;
        --bs-sidebar-bg: #ffffff;
        --bs-body-font-family: "Manrope", system-ui, sans-serif;
        --bs-body-color: var(--peerya-ink);
        --bs-primary: var(--peerya-green);
        --bs-link-color: var(--peerya-green-dark);
        --bs-heading-font-family: "Inter", system-ui, sans-serif;
      }

      * { box-sizing: border-box; }

      html, body { min-height: 100%; min-height: 100dvh; }

      body {
        margin: 0;
        background: #fafafa;
        color: var(--peerya-ink);
        font-family: "Manrope", system-ui, sans-serif;
        visibility: hidden;
      }

      body.is-authed { visibility: visible; }

      .hidden { display: none !important; }

      h1, h2, .sidebar-brand, .suggest-name, .section-title {
        font-family: "Inter", system-ui, sans-serif;
      }

      .sidebar {
        --bs-offcanvas-width: var(--bs-sidebar-width);
        border-right: 1px solid var(--peerya-line);
      }

      .sidebar-brand {
        display: flex;
        align-items: center;
        gap: 0.55rem;
        font-weight: 700;
        font-size: 1.2rem;
        color: var(--peerya-ink);
        text-decoration: none;
      }

      .sidebar-brand img { width: auto; height: 1.75rem; }

      .sidebar-search { position: relative; }

      .sidebar-search i {
        position: absolute;
        left: 0.85rem;
        top: 50%;
        transform: translateY(-50%);
        color: #9a9a9a;
      }

      .sidebar-search .form-control {
        padding-left: 2.3rem;
        border-radius: 999px;
        background: #f4f4f4;
        border-color: transparent;
      }

      .sidebar-nav { list-style: none; padding: 0; margin: 0.5rem 0 0; }

      .sidebar-nav .nav-link {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.7rem 0.85rem;
        color: #4a4a4a;
        border-radius: 0.7rem;
        font-weight: 600;
      }

      .sidebar-nav .nav-link i { font-size: 1.15rem; width: 1.3rem; text-align: center; }
      .sidebar-nav .nav-link:hover, .sidebar-nav .nav-link.active { background: var(--peerya-soft); }
      .sidebar-nav .nav-link.active { color: var(--peerya-green-dark); }

      .nav-badge[hidden] { display: none !important; }

      .nav-badge {
        margin-left: auto;
        min-width: 1.4rem;
        height: 1.4rem;
        padding: 0 0.4rem;
        border-radius: 999px;
        background: #ecebff;
        color: #6b63d6;
        font-size: 0.72rem;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .promo-card {
        border: 1px solid var(--peerya-line);
        border-radius: 0.9rem;
        padding: 0.9rem 1rem;
        background: #fff;
      }

      .promo-icon {
        width: 1.7rem;
        height: 1.7rem;
        border-radius: 50%;
        background: #fff6e8;
        color: #e6a23c;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .sidebar-user {
        display: flex;
        align-items: center;
        gap: 0.7rem;
        padding-top: 0.85rem;
        margin-top: 0.85rem;
        border-top: 1px solid var(--peerya-line);
      }

      .sidebar-user img, .avatar {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        object-fit: cover;
      }

      .sidebar-user .name, .suggest-name {
        font-weight: 700;
        font-size: 0.92rem;
        margin: 0;
      }

      .sidebar-user .role, .friend-status {
        color: #8a8a8a;
        font-size: 0.78rem;
        margin: 0;
      }

      .home-topbar {
        display: none;
        align-items: center;
        justify-content: space-between;
        padding: 0.75rem 1rem;
        background: #fff;
        border-bottom: 1px solid var(--peerya-line);
        position: sticky;
        top: 0;
        z-index: 20;
      }

      .home-shell {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 20rem;
        gap: 1.75rem;
        max-width: 62rem;
        margin: 0 auto;
        padding: 1.25rem 1.5rem 2.5rem;
      }

      .right-rail {
        position: sticky;
        top: 1.25rem;
        align-self: start;
      }

      .account-switch,
      .suggest-item {
        display: flex;
        align-items: center;
        gap: 0.7rem;
      }

      .account-switch {
        margin-bottom: 1.5rem;
        padding-bottom: 1.25rem;
        border-bottom: 1px solid var(--peerya-line);
      }

      .account-switch img {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        object-fit: cover;
      }

      .follow-btn {
        margin-left: auto;
        background: none;
        border: 0;
        padding: 0;
        color: var(--peerya-green-dark);
        font-weight: 700;
        font-size: 0.82rem;
      }

      .follow-btn.following {
        color: #9a9a9a;
        font-weight: 600;
      }

      .suggest-handle {
        color: #8a8a8a;
        font-size: 0.78rem;
        margin: 0;
      }

      .right-rail .section-head {
        display: flex;
        align-items: center;
        margin-bottom: 0.9rem;
        padding: 0;
      }

      .suggest-list {
        display: flex;
        flex-direction: column;
        gap: 0.95rem;
        margin-bottom: 1.75rem;
      }

      .suggest-item img {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        object-fit: cover;
      }

      .feed-empty {
        text-align: center;
        color: #9a9a9a;
        padding: 0.5rem 0;
        margin: 0;
        font-size: 0.85rem;
      }

      .settings-card {
        border: 0;
        border-radius: 1.15rem;
        box-shadow: 0 10px 32px rgba(40, 50, 30, 0.07);
        background: #fff;
        overflow: hidden;
        padding: 1.2rem 1.25rem 1.4rem;
      }

      .settings-card h1 {
        margin: 0 0 1.1rem;
        font-size: 1.2rem;
        font-weight: 700;
        color: var(--peerya-green-dark);
      }

      .avatar-edit {
        display: flex;
        align-items: center;
        gap: 1rem;
        margin-bottom: 1.25rem;
      }

      .avatar-edit img {
        width: 88px;
        height: 88px;
        border-radius: 50%;
        object-fit: cover;
        background: #eee;
        border: 3px solid #f0f4e8;
      }

      .avatar-edit .btn {
        border-radius: 999px;
        font-weight: 700;
        background: var(--peerya-soft);
        border-color: var(--peerya-line);
        color: var(--peerya-ink);
      }

      .settings-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.85rem 1rem;
      }

      .settings-grid .full { grid-column: 1 / -1; }

      .settings-card .form-label {
        font-size: 0.82rem;
        font-weight: 700;
        color: #7a7a7a;
        margin-bottom: 0.3rem;
      }

      .settings-card .form-control,
      .settings-card .form-select {
        border-color: #e8e8e8;
        background: #fafafa;
        min-height: 2.7rem;
        border-radius: 0.7rem;
      }

      .settings-card textarea.form-control {
        min-height: 7rem;
        resize: vertical;
      }

      .settings-save {
        margin-top: 1.1rem;
        border: 0;
        border-radius: 999px;
        background: var(--peerya-green);
        color: #1f2a12;
        font-weight: 700;
        padding: 0.55rem 1.3rem;
      }

      .settings-note {
        display: none;
        margin: 0 0 0.9rem;
        padding: 0.65rem 0.8rem;
        border-radius: 0.6rem;
        font-size: 0.88rem;
      }

      .settings-note.show { display: block; }
      .settings-note.ok { background: #eef7e4; color: #3d6b12; }
      .settings-note.err { background: #fdecea; color: #9b2c2c; }

      .friends-card {
        display: none;
      }

      .friends-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        padding: 1.15rem 1.2rem;
        border-bottom: 1px solid var(--peerya-line);
      }

      .friends-head h1 {
        margin: 0;
        font-size: 1.2rem;
        font-weight: 700;
        color: var(--peerya-green-dark);
      }

      .invite-btn {
        border: 0;
        border-radius: 999px;
        background: var(--peerya-green);
        color: #1f2a12;
        font-weight: 700;
        padding: 0.5rem 1rem;
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
      }

      .friends-status {
        display: none;
        margin: 0;
        padding: 0.7rem 1.2rem;
        font-size: 0.88rem;
      }

      .friends-status.show { display: block; }
      .friends-status.ok { background: #eef7e4; color: #3d6b12; }
      .friends-status.err { background: #fdecea; color: #9b2c2c; }

      .section-head {
        display: flex;
        align-items: center;
        padding: 0.95rem 1.2rem 0.35rem;
      }

      .section-title {
        margin: 0;
        font-size: 0.92rem;
        font-weight: 700;
        color: #7a7a7a;
      }

      .see-all {
        margin-left: auto;
        color: var(--peerya-green-dark);
        font-weight: 700;
        font-size: 0.82rem;
      }

      .friend-list {
        display: flex;
        flex-direction: column;
        padding: 0.2rem 0.7rem 0.9rem;
        gap: 0.15rem;
      }

      .friend-item {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        width: 100%;
        border: 0;
        background: none;
        text-align: left;
        padding: 0.7rem 0.55rem;
        border-radius: 0.85rem;
        color: inherit;
      }

      .friend-item:hover { background: var(--peerya-soft); }

      .friend-avatar { position: relative; width: 44px; height: 44px; flex-shrink: 0; }

      .friend-avatar img {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        object-fit: cover;
      }

      .presence {
        position: absolute;
        right: -1px;
        bottom: -1px;
        width: 0.72rem;
        height: 0.72rem;
        border-radius: 50%;
        border: 2px solid #fff;
        background: #c8c8c8;
      }

      .presence.online { background: var(--peerya-green); }
      .friend-item.online .friend-status { color: var(--peerya-green-dark); font-weight: 600; }

      .friend-meta { min-width: 0; flex: 1; }

      .empty-friends {
        text-align: center;
        color: #9a9a9a;
        padding: 2rem 1.2rem 1.5rem;
      }

      .invite-modal {
        position: fixed;
        inset: 0;
        z-index: 40;
        background: rgba(20, 20, 20, 0.45);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
      }

      .invite-modal.hidden { display: none; }

      .invite-sheet {
        width: min(24rem, 100%);
        background: #fff;
        border-radius: 1.2rem;
        padding: 1.4rem 1.3rem 1.25rem;
        text-align: center;
        box-shadow: 0 18px 50px rgba(20, 30, 10, 0.18);
      }

      .invite-sheet h2 {
        margin: 0 0 0.35rem;
        font-size: 1.2rem;
      }

      .invite-sheet p {
        margin: 0 0 1rem;
        color: #7a7a7a;
        font-size: 0.9rem;
      }

      #invite-qr {
        width: 220px;
        height: 220px;
        margin: 0 auto 1rem;
      }

      #invite-qr img,
      #invite-qr canvas,
      #invite-qr table {
        width: 220px !important;
        height: 220px !important;
      }

      .invite-link {
        width: 100%;
        border: 1px solid var(--peerya-line);
        border-radius: 0.7rem;
        padding: 0.55rem 0.7rem;
        font-size: 0.75rem;
        color: #666;
        background: #f7f7f7;
        margin-bottom: 0.75rem;
      }

      .invite-actions { display: flex; gap: 0.5rem; }

      .invite-actions .btn {
        flex: 1;
        border-radius: 999px;
        font-weight: 700;
      }

      .btn-copy {
        background: var(--peerya-green);
        border-color: var(--peerya-green);
        color: #1f2a12;
      }

      @media (max-width: 1199.98px) {
        .home-shell {
          grid-template-columns: minmax(0, 1fr);
          max-width: 40rem;
        }

        .right-rail { display: none; }
      }

      @media (max-width: 575.98px) {
        .settings-grid { grid-template-columns: 1fr; }
      }

      @media (max-width: 991.98px) {
        .home-topbar { display: flex; }
        .home-shell { padding: 1rem; }
      }
    </style>
  </head>
  <body class="ps-lg-sbwidth">
    <header class="home-topbar">
      <a class="sidebar-brand" href="../home/">
        <img src="../logo_full.svg" alt="Peerya">
      </a>
      <div class="d-flex gap-2">

    </header>

    <nav class="sidebar offcanvas-start offcanvas-lg" tabindex="-1" id="sidebar" aria-label="Main navigation">

          <img src="../logo_full.svg" alt="Peerya">

          <li class="nav-item"><a class="nav-link" href="../explore/"><i class="bi bi-compass"></i> Explore</a></li>

    <main class="home-shell">
      <section>
      <form class="settings-card" id="settings-form">
        <h1>Settings</h1>
        <p class="settings-note" id="settings-note"></p>
        <div class="avatar-edit">
          <img id="settings-avatar" src="../default_avatar.png" alt="Avatar">
          <div>
            <button type="button" class="btn" id="avatar-btn">Upload photo</button>
            <input type="file" id="avatar-file" accept="image/*" hidden>
          </div>
        </div>
        <div class="settings-grid">
          <div>
            <label class="form-label" for="first-name">First name</label>
            <input class="form-control" id="first-name" autocomplete="given-name">
          </div>
          <div>
            <label class="form-label" for="last-name">Last name</label>
            <input class="form-control" id="last-name" autocomplete="family-name">
          </div>
          <div class="full">
            <label class="form-label" for="settings-email">Email</label>
            <input type="email" class="form-control" id="settings-email" autocomplete="email">
          </div>
          <div>
            <label class="form-label" for="birthday">Birthday</label>
            <input type="date" class="form-control" id="birthday">
          </div>
          <div>
            <label class="form-label" for="gender">Gender</label>
            <select class="form-select" id="gender">
              <option value="">Select</option>
              <option value="male">Male</option>
              <option value="female">Female</option>
              <option value="lgbt+">LGBT+</option>
            </select>
          </div>
          <div class="full">
            <label class="form-label" for="about">About me</label>
            <textarea class="form-control" id="about" maxlength="500" placeholder="Tell peers a little about you"></textarea>
          </div>
        </div>
        <button type="submit" class="settings-save">Save changes</button>
      </form>
      </section>

      <aside class="right-rail">
        <div class="account-switch">
          <img class="avatar" id="me-avatar" src="../default_avatar.png" alt="">
          <div>
            <p class="suggest-name" id="me-name">You</p>
            <p class="suggest-handle" id="me-handle"></p>
          </div>
        </div>
        <div class="section-head">
          <h2 class="section-title">Suggested For You</h2>
          <span class="see-all" id="suggested-count">0</span>
        </div>
        <div class="suggest-list" id="suggested-list"></div>
        <div class="section-head">
          <h2 class="section-title">Active Peers</h2>
          <span class="see-all" id="peers-count">0</span>
        </div>
        <div class="suggest-list" id="peers-list"></div>
      </aside>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha256-CDOy6cOibCWEdsRiZuaHf8dSGGJRYuBGC+mjoJimHGw=" crossorigin="anonymous"></script>
    <script type="module">
      import {
        requireAuth,
        signOut,
        avatarUrl,
        displayName as nameOf,
        startPresence,
        applyCurrentUser,
        setNavBadge,
        toggleFollow,
        saveProfile,
        compressImage
      } from "../js/peerya.js"

      const db = await requireAuth()
      if (!db) throw new Error("unauthorized")
      document.body.classList.add("is-authed")

      const me = db.sm.getActiveEthAddress()
      const profiles = new Map()
      const friends = new Map()
      const follows = new Map()
      let pendingAvatar = null
      let filled = false
      let paint = () => {}
      const presence = startPresence(db, () => paint())
      const note = document.getElementById("settings-note")

      document.querySelectorAll(".js-logout").forEach((button) => {
        button.addEventListener("click", async (event) => {
          event.preventDefault()
          await signOut(db)
        })
      })

      const showNote = (message, kind) => {
        note.textContent = message || ""
        note.classList.toggle("show", !!message)
        note.classList.toggle("ok", kind === "ok")
        note.classList.toggle("err", kind === "err")
      }

      const fillForm = (profile) => {
        if (!profile || filled) return
        filled = true
        document.getElementById("first-name").value = profile.firstName || ""
        document.getElementById("last-name").value = profile.lastName || ""
        document.getElementById("settings-email").value = typeof profile.email === "string" && !profile.email.startsWith("{") ? profile.email : ""
        document.getElementById("birthday").value = profile.birthday || ""
        document.getElementById("gender").value = profile.gender || ""
        document.getElementById("about").value = profile.about || ""
        document.getElementById("settings-avatar").src = avatarUrl(me, profile)
      }

      const renderPeople = (root, countEl, list, emptyText) => {
        root.innerHTML = ""
        countEl.textContent = String(list.length)
        if (!list.length) {
          const empty = document.createElement("p")
          empty.className = "feed-empty"
          empty.textContent = emptyText
          root.append(empty)
          return
        }
        for (const person of list) {
          const followed = follows.has("follow:" + me.toLowerCase() + ":" + String(person.address).toLowerCase())
          const row = document.createElement("div")
          row.className = "suggest-item"
          row.innerHTML =
            '<img class="avatar" alt=""><div><p class="suggest-name"></p><p class="suggest-handle"></p></div>' +
            '<button type="button" class="follow-btn"></button>'
          row.querySelector("img").src = avatarUrl(person.address, person)
          row.querySelector(".suggest-name").textContent = nameOf(db, profiles, person.address)
          row.querySelector(".suggest-handle").textContent = "@" + (person.username || db.sm.abbrAddr(person.address))
          const btn = row.querySelector(".follow-btn")
          btn.classList.toggle("following", followed)
          btn.textContent = followed ? "Followed" : "Follow"
          btn.addEventListener("click", () => toggleFollow(db, person.address))
          root.append(row)
        }
      }

      const render = () => {
        fillForm(profiles.get(me.toLowerCase()))
        const people = [...profiles.values()].filter((profile) => String(profile.address).toLowerCase() !== me.toLowerCase())
        const active = people.filter((person) => presence.online.has(String(person.address).toLowerCase()))
        const suggested = people.filter((person) => !presence.online.has(String(person.address).toLowerCase()))
        renderPeople(document.getElementById("suggested-list"), document.getElementById("suggested-count"), suggested, "No other peers yet.")
        renderPeople(document.getElementById("peers-list"), document.getElementById("peers-count"), active, "No peers online.")
        applyCurrentUser(db, profiles)
        setNavBadge("badge-friends", friends.size)
        setNavBadge("badge-notifications", 0)
      }
      paint = render

      document.getElementById("avatar-btn").addEventListener("click", () => {
        document.getElementById("avatar-file").click()
      })
      document.getElementById("avatar-file").addEventListener("change", async () => {
        const file = document.getElementById("avatar-file").files[0]
        document.getElementById("avatar-file").value = ""
        if (!file) return
        const image = await compressImage(file)
        if (!image) return
        pendingAvatar = image
        document.getElementById("settings-avatar").src = image.data
      })

      document.getElementById("settings-form").addEventListener("submit", async (event) => {
        event.preventDefault()
        try {
          await saveProfile(db, {
            username: localStorage.getItem("peerya.username") || "",
            firstName: document.getElementById("first-name").value,
            lastName: document.getElementById("last-name").value,
            email: document.getElementById("settings-email").value,
            birthday: document.getElementById("birthday").value,
            gender: document.getElementById("gender").value,
            about: document.getElementById("about").value,
            avatar: pendingAvatar
          })
          pendingAvatar = null
          showNote("Saved.", "ok")
        } catch {
          showNote("Could not save settings.", "err")
        }
      })

      await db.map({ query: { type: "profile" }, realtime: true }, ({ id, value, action }) => {
        const address = String((value && value.address) || id.replace(/^profile:/, "")).toLowerCase()
        if (action === "removed") profiles.delete(address)
        else if (value) profiles.set(address, value)
        render()
      })

      await db.map({ query: { type: "follow" }, realtime: true }, ({ id, value, action }) => {
        if (action === "removed") follows.delete(id)
        else if (value) follows.set(id, { ...value, id })
        render()
      })

      await db.map({ query: { type: "friend" }, realtime: true }, ({ id, value, action }) => {
        if (action === "removed") friends.delete(id)
        else if (value && (String(value.a).toLowerCase() === me.toLowerCase() || String(value.b).toLowerCase() === me.toLowerCase())) {
          friends.set(id, value)
        }
        render()
      })

      render()
    </script>
  </body>
</html>
