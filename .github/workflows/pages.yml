name: Deploy Peerya

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write admin gate hashes
        env:
          JUNIEADMIN_PASSCODE: ${{ secrets.JUNIEADMIN_PASSCODE }}
          PEERYA_ADMIN_KEY: ${{ secrets.PEERYA_ADMIN_KEY }}
        run: node scripts/write-admin-gate.js
      - name: Stage site
        run: |
          mkdir -p _site
          tar --exclude=.git --exclude=_site --exclude=.github --exclude=node_modules -cf - . | tar -C _site -xf -
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
