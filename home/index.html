<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link rel="icon" href="../icon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Manrope:wght@200..800&display=swap" rel="stylesheet">
    <title>Peerya - Home</title>
    <link href="https://cdn.jsdelivr.net/npm/halfmoon@2.0.2/css/halfmoon.min.css" rel="stylesheet" integrity="sha256-RjeFzczeuZHCyS+Gvz+kleETzBF/o84ZRHukze/yv6o=" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
    <style>
      :root {
        --peerya-green: #8bc34a;
        --peerya-green-dark: #7cb342;
        --peerya-ink: #2f2f2f;
        --peerya-muted: #6f6f6f;
        --peerya-line: #ececec;
        --peerya-soft: #f6f7f4;
        --bs-sidebar-width: 17.5rem;
        --bs-sidebar-bg: #ffffff;
        --bs-body-font-family: "Manrope", system-ui, sans-serif;
        --bs-body-color: var(--peerya-ink);
        --bs-primary: var(--peerya-green);
        --bs-link-color: var(--peerya-green-dark);
        --bs-heading-font-family: "Inter", system-ui, sans-serif;
      }

      * { box-sizing: border-box; }

      html, body {
        min-height: 100%;
        min-height: 100dvh;
      }

      body {
        margin: 0;
        background: #fafafa;
        color: var(--peerya-ink);
        font-family: "Manrope", system-ui, sans-serif;
        -webkit-text-size-adjust: 100%;
        visibility: hidden;
      }

      body.is-authed {
        visibility: visible;
      }

      h1, h2, h3, h4, h5, h6,
      .sidebar-brand,
      .post-user,
      .suggest-name,
      .story-name,
      .section-title {
        font-family: "Inter", system-ui, sans-serif;
      }

      img { max-width: 100%; height: auto; }

      .sidebar {
        --bs-offcanvas-width: var(--bs-sidebar-width);
        border-right: 1px solid var(--peerya-line);
      }

      .sidebar-brand {
        display: flex;
        align-items: center;
        gap: 0.55rem;
        font-weight: 700;
        font-size: 1.2rem;
        color: var(--peerya-ink);
        text-decoration: none;
      }

      .sidebar-brand img {
        width: auto;
        height: 1.75rem;
      }

      .sidebar-search {
        position: relative;
      }

      .sidebar-search i {
        position: absolute;
        left: 0.85rem;
        top: 50%;
        transform: translateY(-50%);
        color: #9a9a9a;
      }

      .sidebar-search .form-control {
        padding-left: 2.3rem;
        border-radius: 999px;
        background: #f4f4f4;
        border-color: transparent;
      }

      .sidebar-nav {
        list-style: none;
        padding: 0;
        margin: 0.5rem 0 0;
      }

      .sidebar-nav .nav-link {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.7rem 0.85rem;
        color: #4a4a4a;
        border-radius: 0.7rem;
        font-weight: 600;
      }

      .sidebar-nav .nav-link i {
        font-size: 1.15rem;
        width: 1.3rem;
        text-align: center;
      }

      .sidebar-nav .nav-link:hover,
      .sidebar-nav .nav-link.active {
        background: var(--peerya-soft);
        color: var(--peerya-ink);
      }

      .sidebar-nav .nav-link.active {
        color: var(--peerya-green-dark);
      }

      .nav-badge[hidden] { display: none !important; }

      .nav-badge {
        margin-left: auto;
        min-width: 1.4rem;
        height: 1.4rem;
        padding: 0 0.4rem;
        border-radius: 999px;
        background: #ecebff;
        color: #6b63d6;
        font-size: 0.72rem;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .promo-card {
        border: 1px solid var(--peerya-line);
        border-radius: 0.9rem;
        padding: 0.9rem 1rem;
        background: #fff;
      }

      .promo-card .promo-icon {
        width: 1.7rem;
        height: 1.7rem;
        border-radius: 50%;
        background: #fff6e8;
        color: #e6a23c;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .sidebar-user {
        display: flex;
        align-items: center;
        gap: 0.7rem;
        padding-top: 0.85rem;
        margin-top: 0.85rem;
        border-top: 1px solid var(--peerya-line);
      }

      .sidebar-user img,
      .avatar {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        object-fit: cover;
      }

      .sidebar-user .meta {
        min-width: 0;
      }

      .sidebar-user .name,
      .suggest-name,
      .post-user {
        font-weight: 700;
        font-size: 0.92rem;
        line-height: 1.2;
        margin: 0;
      }

      .sidebar-user .role,
      .suggest-handle,
      .post-meta,
      .story-name {
        color: #8a8a8a;
        font-size: 0.78rem;
        margin: 0;
      }

      .home-topbar {
        display: none;
        align-items: center;
        justify-content: space-between;
        padding: 0.75rem 1rem;
        background: #fff;
        border-bottom: 1px solid var(--peerya-line);
        position: sticky;
        top: 0;
        z-index: 20;
      }

      .home-shell {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 20rem;
        gap: 1.75rem;
        max-width: 62rem;
        margin: 0 auto;
        padding: 1.25rem 1.5rem 2.5rem;
      }

      .stories-row,
      .stories-swiper {
        position: relative;
        padding: 0.35rem 2.4rem 1.1rem 0.15rem;
        overflow: hidden;
      }

      .stories-swiper .swiper-slide {
        width: 4.6rem;
      }

      .story {
        display: block;
        width: 4.6rem;
        text-align: center;
        text-decoration: none;
        color: inherit;
        user-select: none;
      }

      .story-ring {
        width: 3.6rem;
        height: 3.6rem;
        margin: 0 auto 0.4rem;
        border-radius: 50%;
        padding: 3px;
        background: conic-gradient(from 200deg, #cddc39, #8bc34a, #689f38, #cddc39);
      }

      .story-ring img {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        object-fit: cover;
        border: 2px solid #fff;
      }

      .story-name {
        display: block;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .stories-next {
        position: absolute;
        top: 1.35rem;
        right: 0;
        z-index: 2;
        width: 2rem;
        height: 2rem;
        border: 1px solid var(--peerya-line);
        background: #fff;
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: #888;
      }

      .stories-next.swiper-button-disabled {
        opacity: 0;
        pointer-events: none;
      }

      .composer {
        border: 0;
        border-radius: 1rem;
        box-shadow: 0 8px 28px rgba(40, 50, 30, 0.06);
        background: #fff;
        padding: 1rem 1.1rem 0.95rem;
        margin-bottom: 1.25rem;
      }

      .composer textarea {
        width: 100%;
        border: 0;
        resize: none;
        min-height: 4.2rem;
        font: inherit;
        color: inherit;
        background: transparent;
        outline: none;
      }

      .composer-actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
      }

      .composer .btn {
        background: var(--peerya-green);
        border-color: var(--peerya-green);
        color: #1f2a12;
        font-weight: 700;
        border-radius: 999px;
        padding: 0.4rem 1.1rem;
      }

      .attach-btn {
        border: 0;
        background: none;
        color: var(--peerya-green-dark);
        font-size: 1.35rem;
        padding: 0.2rem;
        line-height: 1;
      }

      .composer-previews {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 0.45rem;
        margin: 0.35rem 0 0.85rem;
      }

      .composer-previews:empty { display: none; }

      .composer-thumb {
        position: relative;
        aspect-ratio: 1;
        border-radius: 0.6rem;
        overflow: hidden;
        background: #eee;
      }

      .composer-thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .composer-thumb button {
        position: absolute;
        top: 0.25rem;
        right: 0.25rem;
        width: 1.35rem;
        height: 1.35rem;
        border: 0;
        border-radius: 50%;
        background: rgba(20, 20, 20, 0.72);
        color: #fff;
        line-height: 1;
        font-size: 0.85rem;
      }

      .post-media-grid {
        display: grid;
        gap: 0.55rem;
        margin: 0 1rem 0.35rem;
        background: transparent;
      }

      .post-media-grid.count-1 { display: block; }

      .post-media-grid.count-1 img {
        display: block;
        width: 100%;
        height: auto;
        max-height: 28rem;
        object-fit: contain;
        border-radius: 1rem;
        cursor: pointer;
        background: #f4f4f4;
      }

      .post-media-grid.count-2 { grid-template-columns: 1fr 1fr; }
      .post-media-grid.count-3 { grid-template-columns: 1fr 1fr 1fr; }
      .post-media-grid.count-4 { grid-template-columns: 1fr 1fr; }

      .post-media-grid.count-2 img,
      .post-media-grid.count-3 img,
      .post-media-grid.count-4 img {
        width: 100%;
        height: 9.8rem;
        object-fit: cover;
        border-radius: 1rem;
        cursor: pointer;
        display: block;
      }

      .lightbox {
        position: fixed;
        inset: 0;
        z-index: 80;
        background: rgba(18, 18, 18, 0.94);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .lightbox.hidden { display: none; }

      .lightbox img {
        max-width: min(92vw, 56rem);
        max-height: 86vh;
        object-fit: contain;
      }

      .lightbox-close,
      .lightbox-prev,
      .lightbox-next {
        position: absolute;
        border: 0;
        background: rgba(255, 255, 255, 0.12);
        color: #fff;
        width: 2.4rem;
        height: 2.4rem;
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 1.2rem;
      }

      .lightbox-close {
        top: 1rem;
        right: 1rem;
      }

      .lightbox-prev { left: 1rem; }
      .lightbox-next { right: 1rem; }

      .feed-empty {
        text-align: center;
        color: #9a9a9a;
        padding: 2rem 1rem;
      }

      .post-card {
        border: 0;
        border-radius: 1.15rem;
        box-shadow: 0 10px 32px rgba(40, 50, 30, 0.07);
        overflow: hidden;
        margin-bottom: 1.25rem;
        background: #fff;
      }

      .post-header,
      .post-body,
      .post-actions {
        padding-left: 1rem;
        padding-right: 1rem;
      }

      .post-header {
        display: flex;
        align-items: center;
        gap: 0.7rem;
        padding-top: 0.9rem;
        padding-bottom: 0.75rem;
      }

      .post-header .avatar {
        width: 36px;
        height: 36px;
      }

      .post-meta {
        margin-top: 0.1rem;
      }

      .post-more {
        margin-left: auto;
        border: 0;
        background: none;
        color: #999;
      }

      .post-media {
        display: block;
        width: 100%;
        aspect-ratio: 4 / 5;
        object-fit: cover;
        background: #eee;
      }

      .post-actions {
        display: flex;
        align-items: center;
        gap: 1.15rem;
        padding: 0.35rem 1rem 0.95rem;
      }

      .post-stat {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        border: 0;
        background: none;
        padding: 0;
        color: #9aa0a6;
        font-weight: 700;
        font-size: 0.86rem;
      }

      .post-stat i { font-size: 1.12rem; }

      .post-stat.on-like { color: var(--peerya-green-dark); }
      .post-stat.on-heart { color: #e74c3c; }

      .post-caption {
        padding: 0.7rem 1rem 0.15rem;
        font-size: 0.95rem;
        line-height: 1.5;
        color: #4a4a4a;
      }

      .post-caption strong {
        font-family: "Inter", system-ui, sans-serif;
        color: var(--peerya-ink);
        margin-right: 0.25rem;
      }

      .post-comments {
        display: none;
        padding: 0.75rem 1rem 1rem;
        border-top: 1px solid var(--peerya-line);
      }

      .post-card.open-comments .post-comments { display: block; }

      .comment-form {
        display: flex;
        gap: 0.5rem;
        margin-bottom: 0.85rem;
      }

      .comment-form .form-control {
        border-radius: 999px;
        background: #f4f4f4;
        border-color: transparent;
        min-height: 2.4rem;
        font-size: 0.9rem;
      }

      .comment-form .btn {
        border-radius: 999px;
        background: var(--peerya-green);
        border-color: var(--peerya-green);
        color: #1f2a12;
        font-weight: 700;
        font-size: 0.82rem;
      }

      .comment-item {
        display: flex;
        gap: 0.6rem;
        padding: 0.45rem 0;
      }

      .comment-item .avatar {
        width: 28px;
        height: 28px;
      }

      .comment-body { min-width: 0; flex: 1; }

      .comment-meta {
        display: flex;
        gap: 0.45rem;
        align-items: baseline;
      }

      .comment-meta strong {
        font-size: 0.82rem;
      }

      .comment-meta span {
        color: #b0b0b0;
        font-size: 0.72rem;
      }

      .comment-text {
        margin: 0.15rem 0 0;
        font-size: 0.88rem;
        color: #4a4a4a;
      }

      .comment-reply {
        border: 0;
        background: none;
        padding: 0;
        color: var(--peerya-green-dark);
        font-size: 0.75rem;
        font-weight: 700;
      }

      .comment-replies {
        padding-left: 2.15rem;
      }

      .comment-empty {
        color: #9a9a9a;
        font-size: 0.85rem;
        margin: 0;
      }

      .right-rail {
        position: sticky;
        top: 1.25rem;
        align-self: start;
      }

      .account-switch,
      .suggest-item {
        display: flex;
        align-items: center;
        gap: 0.7rem;
      }

      .account-switch {
        margin-bottom: 1.5rem;
        padding-bottom: 1.25rem;
        border-bottom: 1px solid var(--peerya-line);
      }

      .account-switch img {
        width: 48px;
        height: 48px;
      }

      .switch-link,
      .follow-btn,
      .see-all {
        margin-left: auto;
        background: none;
        border: 0;
        padding: 0;
        color: var(--peerya-green-dark);
        font-weight: 700;
        font-size: 0.82rem;
        text-decoration: none;
        white-space: nowrap;
      }

      .follow-btn.following {
        color: #9a9a9a;
        font-weight: 600;
      }

      .section-head {
        display: flex;
        align-items: center;
        margin-bottom: 0.9rem;
      }

      .section-title {
        margin: 0;
        font-size: 0.92rem;
        font-weight: 700;
        color: #7a7a7a;
      }

      .suggest-list {
        display: flex;
        flex-direction: column;
        gap: 0.95rem;
        margin-bottom: 1.75rem;
      }

      .suggest-item img {
        width: 36px;
        height: 36px;
      }

      @media (max-width: 1199.98px) {
        .home-shell {
          grid-template-columns: minmax(0, 1fr);
          max-width: 40rem;
        }

        .right-rail {
          display: none;
        }
      }

      @media (max-width: 991.98px) {
        .home-topbar {
          display: flex;
        }

        .home-shell {
          padding: 1rem;
        }
      }
    </style>
  </head>
  <body class="ps-lg-sbwidth">
    <header class="home-topbar">
      <a class="sidebar-brand" href="./">
        <img src="../logo_full.svg" alt="Peerya">
      </a>
      <div class="d-flex gap-2">
        <button type="button" class="btn btn-light js-logout" aria-label="Logout">
          <i class="bi bi-box-arrow-right"></i>
        </button>
        <button type="button" class="btn btn-light" data-bs-toggle="offcanvas" data-bs-target="#sidebar" aria-controls="sidebar">
          <i class="bi bi-list"></i>
        </button>
      </div>
    </header>

    <nav class="sidebar offcanvas-start offcanvas-lg" tabindex="-1" id="sidebar" aria-label="Main navigation">
      <div class="offcanvas-header">
        <a class="sidebar-brand" href="./">
          <img src="../logo_full.svg" alt="Peerya">
        </a>
        <button type="button" class="btn-close d-lg-none" data-bs-dismiss="offcanvas" data-bs-target="#sidebar" aria-label="Close"></button>
      </div>
      <div class="offcanvas-body d-flex flex-column">
        <div class="sidebar-search mb-3">
          <i class="bi bi-search"></i>
          <input type="search" class="form-control" placeholder="Search..." aria-label="Search">
        </div>

        <ul class="sidebar-nav">
          <li class="nav-item">
            <a class="nav-link active" href="./" aria-current="page">
              <i class="bi bi-house-door"></i> Home
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="../messages/">
              <i class="bi bi-chat-dots"></i> Messages
              <span class="nav-badge" id="badge-messages" hidden></span>
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="../friends/">
              <i class="bi bi-people"></i> Friends
              <span class="nav-badge" id="badge-friends" hidden></span>
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#explore">
              <i class="bi bi-compass"></i> Explore
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#notifications">
              <i class="bi bi-bell"></i> Notifications
              <span class="nav-badge" id="badge-notifications" hidden></span>
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="../settings/">
              <i class="bi bi-gear"></i> Settings
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#help">
              <i class="bi bi-question-circle"></i> Help &amp; Support
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link js-logout" href="../">
              <i class="bi bi-box-arrow-right"></i> Logout
            </a>
          </li>
        </ul>

        <div class="mt-auto">
          <div class="promo-card mb-3">
            <div class="d-flex align-items-start justify-content-between mb-2">
              <span class="promo-icon"><i class="bi bi-exclamation-circle"></i></span>
              <button type="button" class="btn-close" aria-label="Dismiss promo"></button>
            </div>
            <p class="mb-2 small text-secondary">Enjoy unlimited access to Peerya with only a small price monthly.</p>
            <div class="d-flex gap-3">
              <button type="button" class="btn btn-link btn-sm px-0 text-secondary">Dismiss</button>
              <a href="#upgrade" class="btn btn-link btn-sm px-0">Go Pro</a>
            </div>
          </div>

          <div class="sidebar-user">
            <img id="side-avatar" src="../icon.svg" alt="">
            <div class="meta">
              <p class="name" id="side-name">You</p>
              <p class="role" id="side-role">Peer</p>
            </div>
             <a href="../" class="ms-auto text-secondary js-logout" aria-label="Logout"><i class="bi bi-box-arrow-right"></i></a>
          </div>
        </div>
      </div>
    </nav>

    <main class="home-shell">
      <section>
        <div class="swiper stories-swiper stories-row" id="stories">
          <div class="swiper-wrapper" id="stories-track"></div>
          <button type="button" class="stories-next" aria-label="Next stories">
            <i class="bi bi-chevron-right"></i>
          </button>
        </div>

        <form class="composer" id="composer">
          <textarea id="composer-text" placeholder="Share with your peers…" maxlength="500"></textarea>
          <div class="composer-previews" id="composer-previews"></div>
          <div class="composer-actions">
            <button type="button" class="attach-btn" id="attach-btn" aria-label="Attach images">
              <i class="bi bi-image"></i>
            </button>
            <input type="file" id="composer-files" accept="image/*" multiple hidden>
            <button type="submit" class="btn">Post</button>
          </div>
        </form>

        <div id="feed"></div>
      </section>

      <aside class="right-rail">
        <div class="account-switch">
          <img class="avatar" id="me-avatar" src="../icon.svg" alt="">
          <div>
            <p class="suggest-name" id="me-name">You</p>
            <p class="suggest-handle" id="me-handle"></p>
          </div>
        </div>

        <div class="section-head">
          <h2 class="section-title">Suggested For You</h2>
          <span class="see-all" id="suggested-count">0</span>
        </div>
        <div class="suggest-list" id="suggested-list"></div>

        <div class="section-head">
          <h2 class="section-title">Active Peers</h2>
          <span class="see-all" id="peers-count">0</span>
        </div>
        <div class="suggest-list" id="peers-list"></div>
      </aside>
    </main>

    <div id="lightbox" class="lightbox hidden" role="dialog" aria-modal="true" aria-label="Post images">
      <button type="button" class="lightbox-close" id="lightbox-close" aria-label="Close"><i class="bi bi-x-lg"></i></button>
      <button type="button" class="lightbox-prev" id="lightbox-prev" aria-label="Previous"><i class="bi bi-chevron-left"></i></button>
      <img id="lightbox-image" alt="">
      <button type="button" class="lightbox-next" id="lightbox-next" aria-label="Next"><i class="bi bi-chevron-right"></i></button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha256-CDOy6cOibCWEdsRiZuaHf8dSGGJRYuBGC+mjoJimHGw=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script type="module">
      import {
        requireAuth,
        signOut,
        avatarUrl,
        displayName,
        timeAgo,
        startPresence,
        publishPost,
        toggleFollow,
        toggleLike,
        toggleHeart,
        addComment,
        applyCurrentUser,
        compressImage,
        MAX_POST_IMAGES,
        setNavBadge
      } from "../js/peerya.js"

      const db = await requireAuth()
      if (!db) throw new Error("unauthorized")
      document.body.classList.add("is-authed")

      const me = db.sm.getActiveEthAddress()
      const meName = localStorage.getItem("peerya.username") || db.sm.abbrAddr(me)
      const profiles = new Map()
      const posts = new Map()
      const likes = new Map()
      const hearts = new Map()
      const comments = new Map()
      const follows = new Map()
      const threads = new Map()
      const friendNodes = new Map()
      const openComments = new Set()
      const replyTo = new Map()
      let swiper

      applyCurrentUser(db, profiles)

      document.querySelectorAll(".js-logout").forEach((button) => {
        button.addEventListener("click", async (event) => {
          event.preventDefault()
          await signOut(db)
        })
      })

      let paint = () => {}
      const presence = startPresence(db, () => paint())
      const nameOf = (address) => displayName(db, profiles, address)

      const others = () =>
        [...profiles.values()].filter((profile) => String(profile.address).toLowerCase() !== me.toLowerCase())

      const renderStories = () => {
        const track = document.getElementById("stories-track")
        const peers = [
          { address: me, username: meName },
          ...others()
        ]
        track.innerHTML = ""
        for (const peer of peers) {
          const slide = document.createElement("div")
          slide.className = "swiper-slide"
          const online = presence.online.has(String(peer.address).toLowerCase()) || peer.address === me
          slide.innerHTML =
            '<a class="story" href="../messages/"><div class="story-ring"><img alt=""></div><span class="story-name"></span></a>'
          slide.querySelector("img").src = avatarUrl(peer.address, profiles)
          slide.querySelector(".story-name").textContent = peer.username || nameOf(peer.address)
          if (!online) slide.querySelector(".story-ring").style.opacity = "0.55"
          track.append(slide)
        }
        if (swiper) swiper.update()
        else {
          swiper = new Swiper("#stories", {
            slidesPerView: "auto",
            spaceBetween: 16,
            grabCursor: true,
            freeMode: { enabled: true, momentum: true },
            mousewheel: { forceToAxis: true },
            navigation: { nextEl: ".stories-next" }
          })
        }
      }

      const renderFeed = () => {
        const feed = document.getElementById("feed")
        const rows = [...posts.values()].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0))
        feed.innerHTML = ""
        if (!rows.length) {
          const empty = document.createElement("p")
          empty.className = "feed-empty"
          empty.textContent = "No posts yet. Share something with your peers."
          feed.append(empty)
          return
        }
        for (const post of rows) {
          const liked = likes.has("like:" + post.id + ":" + me.toLowerCase())
          const hearted = hearts.has("heart:" + post.id + ":" + me.toLowerCase())
          const likeCount = [...likes.values()].filter((item) => item.postId === post.id).length
          const heartCount = [...hearts.values()].filter((item) => item.postId === post.id).length
          const postComments = [...comments.values()].filter((item) => item.postId === post.id)
          const article = document.createElement("article")
          article.className = "card post-card" + (openComments.has(post.id) ? " open-comments" : "")
          article.innerHTML =
            '<div class="post-header"><img class="avatar" alt=""><div><p class="post-user"></p><p class="post-meta"></p></div>' +
            '<button type="button" class="post-more" aria-label="More"><i class="bi bi-three-dots"></i></button></div>' +
            '<div class="post-media-grid"></div>' +
            '<p class="post-caption"><strong></strong><span></span></p>' +
            '<div class="post-actions"></div>' +
            '<div class="post-comments"></div>'
          article.querySelector(".avatar").src = avatarUrl(post.author, profiles)
          article.querySelector(".post-user").textContent = nameOf(post.author)
          article.querySelector(".post-meta").textContent = timeAgo(post.createdAt)
          const pics = Array.isArray(post.images) ? post.images.filter((image) => image && image.data) : []
          const grid = article.querySelector(".post-media-grid")
          if (!pics.length) grid.remove()
          else {
            grid.classList.add("count-" + Math.min(pics.length, 4))
            pics.forEach((image, index) => {
              const img = document.createElement("img")
              img.src = image.data
              img.alt = ""
              img.addEventListener("click", () => openLightbox(pics, index))
              grid.append(img)
            })
          }
          const caption = article.querySelector(".post-caption")
          if (post.caption) {
            caption.querySelector("strong").textContent = nameOf(post.author)
            caption.querySelector("span").textContent = " " + post.caption
          } else caption.remove()
          const actions = article.querySelector(".post-actions")
          const commentBtn = document.createElement("button")
          commentBtn.type = "button"
          commentBtn.className = "post-stat"
          commentBtn.innerHTML = '<i class="bi bi-chat"></i><span></span>'
          commentBtn.querySelector("span").textContent = String(postComments.length)
          commentBtn.addEventListener("click", () => {
            if (openComments.has(post.id)) openComments.delete(post.id)
            else openComments.add(post.id)
            render()
          })
          const likeBtn = document.createElement("button")
          likeBtn.type = "button"
          likeBtn.className = "post-stat" + (liked ? " on-like" : "")
          likeBtn.innerHTML = '<i class="bi ' + (liked ? "bi-hand-thumbs-up-fill" : "bi-hand-thumbs-up") + '"></i><span></span>'
          likeBtn.querySelector("span").textContent = String(likeCount)
          likeBtn.addEventListener("click", () => toggleLike(db, post.id))
          const heartBtn = document.createElement("button")
          heartBtn.type = "button"
          heartBtn.className = "post-stat" + (hearted ? " on-heart" : "")
          heartBtn.innerHTML = '<i class="bi ' + (hearted ? "bi-heart-fill" : "bi-heart") + '"></i><span></span>'
          heartBtn.querySelector("span").textContent = String(heartCount)
          heartBtn.addEventListener("click", () => toggleHeart(db, post.id))
          actions.append(commentBtn, likeBtn, heartBtn)

          const box = article.querySelector(".post-comments")
          const form = document.createElement("form")
          form.className = "comment-form"
          const parentId = replyTo.get(post.id) || ""
          form.innerHTML = '<input type="text" class="form-control" maxlength="280"><button type="submit" class="btn"></button>'
          form.querySelector("input").placeholder = parentId ? "Write a reply…" : "Write a comment…"
          form.querySelector(".btn").textContent = parentId ? "Reply" : "Comment"
          form.addEventListener("submit", async (event) => {
            event.preventDefault()
            const input = form.querySelector("input")
            await addComment(db, post.id, input.value, parentId)
            input.value = ""
            replyTo.delete(post.id)
          })
          box.append(form)
          const roots = postComments.filter((item) => !item.parentId)
          const kids = (parent) => postComments.filter((item) => item.parentId === parent)
          const drawComment = (node, into) => {
            const row = document.createElement("div")
            row.className = "comment-item"
            row.innerHTML =
              '<img class="avatar" alt=""><div class="comment-body"><div class="comment-meta"><strong></strong><span></span></div>' +
              '<p class="comment-text"></p><button type="button" class="comment-reply">Reply</button></div>'
            row.querySelector("img").src = avatarUrl(node.author, profiles)
            row.querySelector("strong").textContent = nameOf(node.author)
            row.querySelector("span").textContent = timeAgo(node.createdAt)
            row.querySelector(".comment-text").textContent = node.text || ""
            row.querySelector(".comment-reply").addEventListener("click", () => {
              openComments.add(post.id)
              replyTo.set(post.id, node.id)
              render()
            })
            into.append(row)
            const replies = kids(node.id)
            if (replies.length) {
              const nest = document.createElement("div")
              nest.className = "comment-replies"
              replies.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0)).forEach((child) => drawComment(child, nest))
              into.append(nest)
            }
          }
          if (!roots.length) {
            const empty = document.createElement("p")
            empty.className = "comment-empty"
            empty.textContent = "Be the first to comment."
            box.append(empty)
          } else {
            roots.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0)).forEach((node) => drawComment(node, box))
          }
          feed.append(article)
        }
      }

      const renderPeople = (root, countEl, list, emptyText) => {
        root.innerHTML = ""
        countEl.textContent = String(list.length)
        if (!list.length) {
          const empty = document.createElement("p")
          empty.className = "feed-empty"
          empty.textContent = emptyText
          root.append(empty)
          return
        }
        for (const person of list) {
          const followed = follows.has("follow:" + me.toLowerCase() + ":" + String(person.address).toLowerCase())
          const row = document.createElement("div")
          row.className = "suggest-item"
          row.innerHTML =
            '<img class="avatar" alt=""><div><p class="suggest-name"></p><p class="suggest-handle"></p></div>' +
            '<button type="button" class="follow-btn"></button>'
          row.querySelector("img").src = avatarUrl(person.address, profiles)
          row.querySelector(".suggest-name").textContent = nameOf(person.address)
          row.querySelector(".suggest-handle").textContent = "@" + (person.username || db.sm.abbrAddr(person.address))
          const btn = row.querySelector(".follow-btn")
          btn.classList.toggle("following", followed)
          btn.textContent = followed ? "Followed" : "Follow"
          btn.addEventListener("click", () => toggleFollow(db, person.address))
          root.append(row)
        }
      }

      const render = () => {
        const people = others()
        const active = people.filter((person) => presence.online.has(String(person.address).toLowerCase()))
        const suggested = people.filter((person) => !presence.online.has(String(person.address).toLowerCase()))
        renderStories()
        renderFeed()
        renderPeople(document.getElementById("suggested-list"), document.getElementById("suggested-count"), suggested, "No other peers yet.")
        renderPeople(document.getElementById("peers-list"), document.getElementById("peers-count"), active, "No peers online.")
        applyCurrentUser(db, profiles)
        setNavBadge("badge-friends", friendNodes.size)
        setNavBadge("badge-messages", threads.size)
        setNavBadge("badge-notifications", 0)
      }
      paint = render

      let pendingImages = []
      let lightboxImages = []
      let lightboxIndex = 0

      const previews = document.getElementById("composer-previews")
      const fileInput = document.getElementById("composer-files")
      const lightbox = document.getElementById("lightbox")
      const lightboxImage = document.getElementById("lightbox-image")

      const renderPreviews = () => {
        previews.innerHTML = ""
        pendingImages.forEach((image, index) => {
          const thumb = document.createElement("div")
          thumb.className = "composer-thumb"
          thumb.innerHTML = '<img alt=""><button type="button" aria-label="Remove">&times;</button>'
          thumb.querySelector("img").src = image.data
          thumb.querySelector("button").addEventListener("click", () => {
            pendingImages.splice(index, 1)
            renderPreviews()
          })
          previews.append(thumb)
        })
      }

      const openLightbox = (images, index) => {
        lightboxImages = images
        lightboxIndex = index
        lightboxImage.src = images[index].data
        const many = images.length > 1
        document.getElementById("lightbox-prev").style.visibility = many ? "visible" : "hidden"
        document.getElementById("lightbox-next").style.visibility = many ? "visible" : "hidden"
        lightbox.classList.remove("hidden")
      }

      const closeLightbox = () => {
        lightbox.classList.add("hidden")
        lightboxImage.src = ""
      }

      const stepLightbox = (dir) => {
        if (!lightboxImages.length) return
        lightboxIndex = (lightboxIndex + dir + lightboxImages.length) % lightboxImages.length
        lightboxImage.src = lightboxImages[lightboxIndex].data
      }

      document.getElementById("attach-btn").addEventListener("click", () => fileInput.click())
      fileInput.addEventListener("change", async () => {
        const files = [...fileInput.files]
        fileInput.value = ""
        const room = MAX_POST_IMAGES - pendingImages.length
        for (const file of files.slice(0, room)) {
          const image = await compressImage(file)
          if (image) pendingImages.push(image)
        }
        renderPreviews()
      })

      document.getElementById("lightbox-close").addEventListener("click", closeLightbox)
      document.getElementById("lightbox-prev").addEventListener("click", () => stepLightbox(-1))
      document.getElementById("lightbox-next").addEventListener("click", () => stepLightbox(1))
      lightbox.addEventListener("click", (event) => {
        if (event.target === lightbox) closeLightbox()
      })
      document.addEventListener("keydown", (event) => {
        if (lightbox.classList.contains("hidden")) return
        if (event.key === "Escape") closeLightbox()
        if (event.key === "ArrowLeft") stepLightbox(-1)
        if (event.key === "ArrowRight") stepLightbox(1)
      })

      document.getElementById("composer").addEventListener("submit", async (event) => {
        event.preventDefault()
        const field = document.getElementById("composer-text")
        try {
          await publishPost(db, field.value, pendingImages)
          field.value = ""
          pendingImages = []
          renderPreviews()
        } catch {}
      })

      await db.map({ query: { type: "profile" }, realtime: true }, ({ id, value, action }) => {
        const address = String((value && value.address) || id.replace(/^profile:/, "")).toLowerCase()
        if (action === "removed") profiles.delete(address)
        else if (value) profiles.set(address, value)
        render()
      })

      await db.map({ query: { type: "post" }, realtime: true }, ({ id, value, action }) => {
        if (action === "removed") posts.delete(id)
        else if (value) posts.set(id, { ...value, id })
        render()
      })

      await db.map({ query: { type: "like" }, realtime: true }, ({ id, value, action }) => {
        if (action === "removed") likes.delete(id)
        else if (value) likes.set(id, { ...value, id })
        render()
      })

      await db.map({ query: { type: "heart" }, realtime: true }, ({ id, value, action }) => {
        if (action === "removed") hearts.delete(id)
        else if (value) hearts.set(id, { ...value, id })
        render()
      })

      await db.map({ query: { type: "comment" }, realtime: true }, ({ id, value, action }) => {
        if (action === "removed") comments.delete(id)
        else if (value) comments.set(id, { ...value, id })
        render()
      })

      await db.map({ query: { type: "friend" }, realtime: true }, ({ id, value, action }) => {
        if (action === "removed") friendNodes.delete(id)
        else if (value && (String(value.a).toLowerCase() === me.toLowerCase() || String(value.b).toLowerCase() === me.toLowerCase())) {
          friendNodes.set(id, value)
        }
        render()
      })

      await db.map({ query: { type: "thread" }, realtime: true }, ({ id, value, action }) => {
        if (action === "removed") threads.delete(id)
        else if (value && (value.a === me.toLowerCase() || value.b === me.toLowerCase() || value.a === me || value.b === me)) {
          threads.set(id, value)
        }
        render()
      })

      await db.map({ query: { type: "follow" }, realtime: true }, ({ id, value, action }) => {
        if (action === "removed") follows.delete(id)
        else if (value) follows.set(id, { ...value, id })
        render()
      })

      render()
    </script>
  </body>
</html>
