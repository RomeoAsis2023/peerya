<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link rel="icon" href="../icon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Manrope:wght@200..800&display=swap" rel="stylesheet">
    <title>Peerya - Home</title>
    <link href="https://cdn.jsdelivr.net/npm/halfmoon@2.0.2/css/halfmoon.min.css" rel="stylesheet" integrity="sha256-RjeFzczeuZHCyS+Gvz+kleETzBF/o84ZRHukze/yv6o=" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
    <style>
      :root {
        --peerya-green: #8bc34a;
        --peerya-green-dark: #7cb342;
        --peerya-ink: #2f2f2f;
        --peerya-muted: #6f6f6f;
        --peerya-line: #ececec;
        --peerya-soft: #f6f7f4;
        --bs-sidebar-width: 17.5rem;
        --bs-sidebar-bg: #ffffff;
        --bs-body-font-family: "Manrope", system-ui, sans-serif;
        --bs-body-color: var(--peerya-ink);
        --bs-primary: var(--peerya-green);
        --bs-link-color: var(--peerya-green-dark);
        --bs-heading-font-family: "Inter", system-ui, sans-serif;
      }

      * { box-sizing: border-box; }

      html, body {
        min-height: 100%;
        min-height: 100dvh;
      }

      body {
        margin: 0;
        background: #fafafa;
        color: var(--peerya-ink);
        font-family: "Manrope", system-ui, sans-serif;
        -webkit-text-size-adjust: 100%;
        visibility: hidden;
      }

      body.is-authed {
        visibility: visible;
      }

      h1, h2, h3, h4, h5, h6,
      .sidebar-brand,
      .post-user,
      .suggest-name,
      .story-name,
      .section-title {
        font-family: "Inter", system-ui, sans-serif;
      }

      img { max-width: 100%; height: auto; }

      .sidebar {
        --bs-offcanvas-width: var(--bs-sidebar-width);
        border-right: 1px solid var(--peerya-line);
      }

      .sidebar-brand {
        display: flex;
        align-items: center;
        gap: 0.55rem;
        font-weight: 700;
        font-size: 1.2rem;
        color: var(--peerya-ink);
        text-decoration: none;
      }

      .sidebar-brand img {
        width: auto;
        height: 1.75rem;
      }

      .sidebar-search {
        position: relative;
      }

      .sidebar-search i {
        position: absolute;
        left: 0.85rem;
        top: 50%;
        transform: translateY(-50%);
        color: #9a9a9a;
      }

      .sidebar-search .form-control {
        padding-left: 2.3rem;
        border-radius: 999px;
        background: #f4f4f4;
        border-color: transparent;
      }

      .sidebar-nav {
        list-style: none;
        padding: 0;
        margin: 0.5rem 0 0;
      }

      .sidebar-nav .nav-link {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.7rem 0.85rem;
        color: #4a4a4a;
        border-radius: 0.7rem;
        font-weight: 600;
      }

      .sidebar-nav .nav-link i {
        font-size: 1.15rem;
        width: 1.3rem;
        text-align: center;
      }

      .sidebar-nav .nav-link:hover,
      .sidebar-nav .nav-link.active {
        background: var(--peerya-soft);
        color: var(--peerya-ink);
      }

      .sidebar-nav .nav-link.active {
        color: var(--peerya-green-dark);
      }

      .nav-badge {
        margin-left: auto;
        min-width: 1.4rem;
        height: 1.4rem;
        padding: 0 0.4rem;
        border-radius: 999px;
        background: #ecebff;
        color: #6b63d6;
        font-size: 0.72rem;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .promo-card {
        border: 1px solid var(--peerya-line);
        border-radius: 0.9rem;
        padding: 0.9rem 1rem;
        background: #fff;
      }

      .promo-card .promo-icon {
        width: 1.7rem;
        height: 1.7rem;
        border-radius: 50%;
        background: #fff6e8;
        color: #e6a23c;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .sidebar-user {
        display: flex;
        align-items: center;
        gap: 0.7rem;
        padding-top: 0.85rem;
        margin-top: 0.85rem;
        border-top: 1px solid var(--peerya-line);
      }

      .sidebar-user img,
      .avatar {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        object-fit: cover;
      }

      .sidebar-user .meta {
        min-width: 0;
      }

      .sidebar-user .name,
      .suggest-name,
      .post-user {
        font-weight: 700;
        font-size: 0.92rem;
        line-height: 1.2;
        margin: 0;
      }

      .sidebar-user .role,
      .suggest-handle,
      .post-meta,
      .story-name {
        color: #8a8a8a;
        font-size: 0.78rem;
        margin: 0;
      }

      .home-topbar {
        display: none;
        align-items: center;
        justify-content: space-between;
        padding: 0.75rem 1rem;
        background: #fff;
        border-bottom: 1px solid var(--peerya-line);
        position: sticky;
        top: 0;
        z-index: 20;
      }

      .home-shell {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 20rem;
        gap: 1.75rem;
        max-width: 62rem;
        margin: 0 auto;
        padding: 1.25rem 1.5rem 2.5rem;
      }

      .stories-row,
      .stories-swiper {
        position: relative;
        padding: 0.35rem 2.4rem 1.1rem 0.15rem;
        overflow: hidden;
      }

      .stories-swiper .swiper-slide {
        width: 4.6rem;
      }

      .story {
        display: block;
        width: 4.6rem;
        text-align: center;
        text-decoration: none;
        color: inherit;
        user-select: none;
      }

      .story-ring {
        width: 3.6rem;
        height: 3.6rem;
        margin: 0 auto 0.4rem;
        border-radius: 50%;
        padding: 3px;
        background: conic-gradient(from 200deg, #cddc39, #8bc34a, #689f38, #cddc39);
      }

      .story-ring img {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        object-fit: cover;
        border: 2px solid #fff;
      }

      .story-name {
        display: block;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .stories-next {
        position: absolute;
        top: 1.35rem;
        right: 0;
        z-index: 2;
        width: 2rem;
        height: 2rem;
        border: 1px solid var(--peerya-line);
        background: #fff;
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: #888;
      }

      .stories-next.swiper-button-disabled {
        opacity: 0;
        pointer-events: none;
      }

      .composer {
        border: 0;
        border-radius: 1rem;
        box-shadow: 0 8px 28px rgba(40, 50, 30, 0.06);
        background: #fff;
        padding: 1rem 1.1rem 0.95rem;
        margin-bottom: 1.25rem;
      }

      .composer textarea {
        width: 100%;
        border: 0;
        resize: none;
        min-height: 4.2rem;
        font: inherit;
        color: inherit;
        background: transparent;
        outline: none;
      }

      .composer-actions {
        display: flex;
        justify-content: flex-end;
      }

      .composer .btn {
        background: var(--peerya-green);
        border-color: var(--peerya-green);
        color: #1f2a12;
        font-weight: 700;
        border-radius: 999px;
        padding: 0.4rem 1.1rem;
      }

      .feed-empty {
        text-align: center;
        color: #9a9a9a;
        padding: 2rem 1rem;
      }

      .post-card {
        border: 0;
        border-radius: 1rem;
        box-shadow: 0 8px 28px rgba(40, 50, 30, 0.06);
        overflow: hidden;
        margin-bottom: 1.25rem;
      }

      .post-header,
      .post-body,
      .post-actions {
        padding-left: 1rem;
        padding-right: 1rem;
      }

      .post-header {
        display: flex;
        align-items: center;
        gap: 0.7rem;
        padding-top: 0.9rem;
        padding-bottom: 0.75rem;
      }

      .post-header .avatar {
        width: 36px;
        height: 36px;
      }

      .post-meta {
        margin-top: 0.1rem;
      }

      .post-more {
        margin-left: auto;
        border: 0;
        background: none;
        color: #999;
      }

      .post-media {
        display: block;
        width: 100%;
        aspect-ratio: 4 / 5;
        object-fit: cover;
        background: #eee;
      }

      .post-actions {
        display: flex;
        align-items: center;
        gap: 0.85rem;
        padding-top: 0.75rem;
      }

      .post-actions button {
        border: 0;
        background: none;
        padding: 0;
        color: #444;
        font-size: 1.35rem;
        line-height: 1;
      }

      .post-actions button.liked {
        color: #e74c3c;
      }

      .post-actions .bookmark {
        margin-left: auto;
      }

      .post-likes {
        font-weight: 700;
        font-size: 0.9rem;
        padding: 0.45rem 1rem 0.2rem;
      }

      .post-caption,
      .post-comments {
        padding: 0 1rem;
        font-size: 0.92rem;
        color: #4a4a4a;
      }

      .post-caption strong {
        font-family: "Inter", system-ui, sans-serif;
        color: var(--peerya-ink);
      }

      .post-comments {
        color: #9a9a9a;
        padding-bottom: 1rem;
      }

      .right-rail {
        position: sticky;
        top: 1.25rem;
        align-self: start;
      }

      .account-switch,
      .suggest-item {
        display: flex;
        align-items: center;
        gap: 0.7rem;
      }

      .account-switch {
        margin-bottom: 1.5rem;
        padding-bottom: 1.25rem;
        border-bottom: 1px solid var(--peerya-line);
      }

      .account-switch img {
        width: 48px;
        height: 48px;
      }

      .switch-link,
      .follow-btn,
      .see-all {
        margin-left: auto;
        background: none;
        border: 0;
        padding: 0;
        color: var(--peerya-green-dark);
        font-weight: 700;
        font-size: 0.82rem;
        text-decoration: none;
        white-space: nowrap;
      }

      .follow-btn.following {
        color: #9a9a9a;
        font-weight: 600;
      }

      .section-head {
        display: flex;
        align-items: center;
        margin-bottom: 0.9rem;
      }

      .section-title {
        margin: 0;
        font-size: 0.92rem;
        font-weight: 700;
        color: #7a7a7a;
      }

      .suggest-list {
        display: flex;
        flex-direction: column;
        gap: 0.95rem;
        margin-bottom: 1.75rem;
      }

      .suggest-item img {
        width: 36px;
        height: 36px;
      }

      @media (max-width: 1199.98px) {
        .home-shell {
          grid-template-columns: minmax(0, 1fr);
          max-width: 40rem;
        }

        .right-rail {
          display: none;
        }
      }

      @media (max-width: 991.98px) {
        .home-topbar {
          display: flex;
        }

        .home-shell {
          padding: 1rem;
        }
      }
    </style>
  </head>
  <body class="ps-lg-sbwidth">
    <header class="home-topbar">
      <a class="sidebar-brand" href="./">
        <img src="../logo_full.svg" alt="Peerya">
      </a>
      <div class="d-flex gap-2">
        <button type="button" class="btn btn-light js-logout" aria-label="Logout">
          <i class="bi bi-box-arrow-right"></i>
        </button>
        <button type="button" class="btn btn-light" data-bs-toggle="offcanvas" data-bs-target="#sidebar" aria-controls="sidebar">
          <i class="bi bi-list"></i>
        </button>
      </div>
    </header>

    <nav class="sidebar offcanvas-start offcanvas-lg" tabindex="-1" id="sidebar" aria-label="Main navigation">
      <div class="offcanvas-header">
        <a class="sidebar-brand" href="./">
          <img src="../logo_full.svg" alt="Peerya">
        </a>
        <button type="button" class="btn-close d-lg-none" data-bs-dismiss="offcanvas" data-bs-target="#sidebar" aria-label="Close"></button>
      </div>
      <div class="offcanvas-body d-flex flex-column">
        <div class="sidebar-search mb-3">
          <i class="bi bi-search"></i>
          <input type="search" class="form-control" placeholder="Search..." aria-label="Search">
        </div>

        <ul class="sidebar-nav">
          <li class="nav-item">
            <a class="nav-link active" href="./" aria-current="page">
              <i class="bi bi-house-door"></i> Home
              <span class="nav-badge">10</span>
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="../messages/">
              <i class="bi bi-chat-dots"></i> Messages
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#friends">
              <i class="bi bi-people"></i> Friends
              <span class="nav-badge">2</span>
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#explore">
              <i class="bi bi-compass"></i> Explore
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#notifications">
              <i class="bi bi-bell"></i> Notifications
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#settings">
              <i class="bi bi-gear"></i> Settings
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#help">
              <i class="bi bi-question-circle"></i> Help &amp; Support
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link js-logout" href="../">
              <i class="bi bi-box-arrow-right"></i> Logout
            </a>
          </li>
        </ul>

        <div class="mt-auto">
          <div class="promo-card mb-3">
            <div class="d-flex align-items-start justify-content-between mb-2">
              <span class="promo-icon"><i class="bi bi-exclamation-circle"></i></span>
              <button type="button" class="btn-close" aria-label="Dismiss promo"></button>
            </div>
            <p class="mb-2 small text-secondary">Enjoy unlimited access to Peerya with only a small price monthly.</p>
            <div class="d-flex gap-3">
              <button type="button" class="btn btn-link btn-sm px-0 text-secondary">Dismiss</button>
              <a href="#upgrade" class="btn btn-link btn-sm px-0">Go Pro</a>
            </div>
          </div>

          <div class="sidebar-user">
            <img id="side-avatar" src="../icon.svg" alt="">
            <div class="meta">
              <p class="name" id="side-name">You</p>
              <p class="role" id="side-role">Peer</p>
            </div>
             <a href="../" class="ms-auto text-secondary js-logout" aria-label="Logout"><i class="bi bi-box-arrow-right"></i></a>
          </div>
        </div>
      </div>
    </nav>

    <main class="home-shell">
      <section>
        <div class="swiper stories-swiper stories-row" id="stories">
          <div class="swiper-wrapper" id="stories-track"></div>
          <button type="button" class="stories-next" aria-label="Next stories">
            <i class="bi bi-chevron-right"></i>
          </button>
        </div>

        <form class="composer" id="composer">
          <textarea id="composer-text" placeholder="Share with your peers…" maxlength="500"></textarea>
          <div class="composer-actions">
            <button type="submit" class="btn">Post</button>
          </div>
        </form>

        <div id="feed"></div>
      </section>

      <aside class="right-rail">
        <div class="account-switch">
          <img class="avatar" id="me-avatar" src="../icon.svg" alt="">
          <div>
            <p class="suggest-name" id="me-name">You</p>
            <p class="suggest-handle" id="me-handle"></p>
          </div>
        </div>

        <div class="section-head">
          <h2 class="section-title">Suggested For You</h2>
          <span class="see-all" id="suggested-count">0</span>
        </div>
        <div class="suggest-list" id="suggested-list"></div>

        <div class="section-head">
          <h2 class="section-title">Active Peers</h2>
          <span class="see-all" id="peers-count">0</span>
        </div>
        <div class="suggest-list" id="peers-list"></div>
      </aside>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha256-CDOy6cOibCWEdsRiZuaHf8dSGGJRYuBGC+mjoJimHGw=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script type="module">
      import {
        requireAuth,
        signOut,
        avatarUrl,
        displayName,
        timeAgo,
        startPresence,
        publishPost,
        toggleFollow,
        toggleLike
      } from "../js/peerya.js"

      const db = await requireAuth()
      if (!db) throw new Error("unauthorized")
      document.body.classList.add("is-authed")

      const me = db.sm.getActiveEthAddress()
      const meName = localStorage.getItem("peerya.username") || db.sm.abbrAddr(me)
      const profiles = new Map()
      const posts = new Map()
      const likes = new Map()
      const follows = new Map()
      let swiper

      document.getElementById("side-avatar").src = avatarUrl(me)
      document.getElementById("side-name").textContent = meName
      document.getElementById("me-avatar").src = avatarUrl(me)
      document.getElementById("me-name").textContent = meName
      document.getElementById("me-handle").textContent = db.sm.abbrAddr(me)

      document.querySelectorAll(".js-logout").forEach((button) => {
        button.addEventListener("click", async (event) => {
          event.preventDefault()
          await signOut(db)
        })
      })

      let paint = () => {}
      const presence = startPresence(db, () => paint())
      const nameOf = (address) => displayName(db, profiles, address)

      const others = () =>
        [...profiles.values()].filter((profile) => String(profile.address).toLowerCase() !== me.toLowerCase())

      const renderStories = () => {
        const track = document.getElementById("stories-track")
        const peers = [
          { address: me, username: meName },
          ...others()
        ]
        track.innerHTML = ""
        for (const peer of peers) {
          const slide = document.createElement("div")
          slide.className = "swiper-slide"
          const online = presence.online.has(String(peer.address).toLowerCase()) || peer.address === me
          slide.innerHTML =
            '<a class="story" href="../messages/"><div class="story-ring"><img alt=""></div><span class="story-name"></span></a>'
          slide.querySelector("img").src = avatarUrl(peer.address)
          slide.querySelector(".story-name").textContent = peer.username || nameOf(peer.address)
          if (!online) slide.querySelector(".story-ring").style.opacity = "0.55"
          track.append(slide)
        }
        if (swiper) swiper.update()
        else {
          swiper = new Swiper("#stories", {
            slidesPerView: "auto",
            spaceBetween: 16,
            grabCursor: true,
            freeMode: { enabled: true, momentum: true },
            mousewheel: { forceToAxis: true },
            navigation: { nextEl: ".stories-next" }
          })
        }
      }

      const renderFeed = () => {
        const feed = document.getElementById("feed")
        const rows = [...posts.values()].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0))
        feed.innerHTML = ""
        if (!rows.length) {
          const empty = document.createElement("p")
          empty.className = "feed-empty"
          empty.textContent = "No posts yet. Share something with your peers."
          feed.append(empty)
          return
        }
        for (const post of rows) {
          const liked = likes.has("like:" + post.id + ":" + me.toLowerCase())
          const likeCount = [...likes.values()].filter((like) => like.postId === post.id).length
          const article = document.createElement("article")
          article.className = "card post-card"
          article.innerHTML =
            '<div class="post-header"><img class="avatar" alt=""><div><p class="post-user"></p><p class="post-meta"></p></div></div>' +
            '<div class="post-actions"><button type="button" class="like-btn"></button>' +
            '<a href="../messages/" aria-label="Message"><i class="bi bi-chat"></i></a></div>' +
            '<p class="post-likes mb-1"></p><p class="post-caption mb-0"><strong></strong> <span></span></p>'
          article.querySelector(".avatar").src = avatarUrl(post.author)
          article.querySelector(".post-user").textContent = nameOf(post.author)
          article.querySelector(".post-meta").textContent = timeAgo(post.createdAt)
          const likeBtn = article.querySelector(".like-btn")
          likeBtn.classList.toggle("liked", liked)
          likeBtn.setAttribute("aria-label", liked ? "Unlike" : "Like")
          likeBtn.innerHTML = liked ? '<i class="bi bi-heart-fill"></i>' : '<i class="bi bi-heart"></i>'
          likeBtn.addEventListener("click", () => toggleLike(db, post.id))
          article.querySelector(".post-likes").textContent = likeCount ? likeCount + " likes" : "Be the first to like"
          article.querySelector("strong").textContent = nameOf(post.author)
          article.querySelector("span").textContent = post.caption || ""
          feed.append(article)
        }
      }

      const renderPeople = (root, countEl, list, emptyText) => {
        root.innerHTML = ""
        countEl.textContent = String(list.length)
        if (!list.length) {
          const empty = document.createElement("p")
          empty.className = "feed-empty"
          empty.textContent = emptyText
          root.append(empty)
          return
        }
        for (const person of list) {
          const followed = follows.has("follow:" + me.toLowerCase() + ":" + String(person.address).toLowerCase())
          const row = document.createElement("div")
          row.className = "suggest-item"
          row.innerHTML =
            '<img class="avatar" alt=""><div><p class="suggest-name"></p><p class="suggest-handle"></p></div>' +
            '<button type="button" class="follow-btn"></button>'
          row.querySelector("img").src = avatarUrl(person.address)
          row.querySelector(".suggest-name").textContent = nameOf(person.address)
          row.querySelector(".suggest-handle").textContent = "@" + (person.username || db.sm.abbrAddr(person.address))
          const btn = row.querySelector(".follow-btn")
          btn.classList.toggle("following", followed)
          btn.textContent = followed ? "Followed" : "Follow"
          btn.addEventListener("click", () => toggleFollow(db, person.address))
          root.append(row)
        }
      }

      const render = () => {
        const people = others()
        const active = people.filter((person) => presence.online.has(String(person.address).toLowerCase()))
        const suggested = people.filter((person) => !presence.online.has(String(person.address).toLowerCase()))
        renderStories()
        renderFeed()
        renderPeople(document.getElementById("suggested-list"), document.getElementById("suggested-count"), suggested, "No other peers yet.")
        renderPeople(document.getElementById("peers-list"), document.getElementById("peers-count"), active, "No peers online.")
      }
      paint = render

      document.getElementById("composer").addEventListener("submit", async (event) => {
        event.preventDefault()
        const field = document.getElementById("composer-text")
        try {
          await publishPost(db, field.value)
          field.value = ""
        } catch {}
      })

      await db.map({ query: { type: "profile" }, realtime: true }, ({ id, value, action }) => {
        const address = String((value && value.address) || id.replace(/^profile:/, "")).toLowerCase()
        if (action === "removed") profiles.delete(address)
        else if (value) profiles.set(address, value)
        render()
      })

      await db.map({ query: { type: "post" }, realtime: true }, ({ id, value, action }) => {
        if (action === "removed") posts.delete(id)
        else if (value) posts.set(id, { ...value, id })
        render()
      })

      await db.map({ query: { type: "like" }, realtime: true }, ({ id, value, action }) => {
        if (action === "removed") likes.delete(id)
        else if (value) likes.set(id, { ...value, id })
        render()
      })

      await db.map({ query: { type: "follow" }, realtime: true }, ({ id, value, action }) => {
        if (action === "removed") follows.delete(id)
        else if (value) follows.set(id, { ...value, id })
        render()
      })

      render()
    </script>
  </body>
</html>
