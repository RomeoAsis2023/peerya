<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>Peerya Superadmin</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/admin.css?v=scp14">
    <style>
      html, body { margin: 0; min-height: 100%; background: #f3f4f0; font-family: system-ui, sans-serif; }
      .scp-gate { position: fixed; inset: 0; z-index: 8100; display: flex; align-items: center; justify-content: center; background: rgba(20, 24, 16, 0.55); }
      .scp-card { width: min(22rem, calc(100vw - 2rem)); background: #fff; border-radius: 1.1rem; box-shadow: 0 18px 50px rgba(40, 50, 30, 0.2); padding: 1.4rem 1.35rem 1.25rem; }
      .scp-card img { height: 1.7rem; width: auto; margin-bottom: 0.85rem; }
      .scp-card h1 { font-size: 1.15rem; font-weight: 800; margin: 0 0 0.35rem; }
      .scp-card p { color: #8a8a8a; font-size: 0.88rem; margin: 0 0 0.9rem; }
      .scp-card input, .scp-card textarea { width: 100%; box-sizing: border-box; border: 1px solid #ececec; border-radius: 0.7rem; padding: 0.7rem 0.8rem; margin-bottom: 0.7rem; font: inherit; }
      .scp-card input { min-height: 2.6rem; }
      .scp-card textarea { min-height: 6.2rem; resize: vertical; }
      .scp-card .btn { width: 100%; border: 0; border-radius: 999px; background: #8bc34a; color: #1f2a12; font-weight: 700; min-height: 2.6rem; cursor: pointer; }
      .scp-card .btn.ghost { background: #eef3e6; margin-top: 0.55rem; }
      .scp-err { color: #c0392b; font-size: 0.82rem; min-height: 1.1rem; margin: 0 0 0.55rem; }
      .scp-check { display: flex; gap: 0.5rem; align-items: flex-start; font-size: 0.82rem; color: #5a5a5a; margin: 0 0 0.85rem; }
      .scp-check input { width: auto; min-height: 0; margin: 0.15rem 0 0; }
      .hidden { display: none !important; }
    </style>
  </head>
  <body>
    <div id="scp-gate" class="scp-gate">
      <form class="scp-card" id="scp-pass-form">
        <img alt="Peerya" src="logo_full.svg">
        <h1>Superadmin</h1>
        <p>Enter the passcode to continue.</p>
        <p class="scp-err" id="scp-pass-err"></p>
        <input type="password" id="scp-pass" autocomplete="current-password" placeholder="Passcode">
        <button type="submit" class="btn">Continue</button>
      </form>
      <form class="scp-card hidden" id="scp-register-form">
        <img alt="Peerya" src="logo_full.svg">
        <h1>Create Superadmin</h1>
        <p>Save these 12 words. They exist only in this CP, not on Peerya.</p>
        <p class="scp-err" id="scp-register-err"></p>
        <textarea id="scp-new-phrase" readonly></textarea>
        <button type="button" class="btn ghost" id="scp-copy-phrase">Copy phrase</button>
        <label class="scp-check"><input type="checkbox" id="scp-saved"> I saved this phrase offline</label>
        <button type="submit" class="btn">Create Superadmin</button>
        <button type="button" class="btn ghost" id="scp-have-phrase">I already have a phrase</button>
      </form>
      <form class="scp-card hidden" id="scp-phrase-form">
        <img alt="Peerya" src="logo_full.svg">
        <h1>Superadmin</h1>
        <p>Paste your Superadmin 12-word phrase. This is not a Peerya account.</p>
        <p class="scp-err" id="scp-phrase-err"></p>
        <textarea id="scp-phrase" placeholder="twelve word recovery phrase" autocomplete="off"></textarea>
        <button type="submit" class="btn">Unlock</button>
      </form>
    </div>
    <script>
      window.__PEERYA_SCP_APP__ = true
    </script>
    <script type="module">
      import { ADMIN_PASS_HASH } from "./js/admin-gate.js"
      import { canCreateSuperadmin, createSuperadmin, confirmSuperadmin, unlockWithPhrase } from "./js/scp-auth.js"

      let pending = null

      async function sha256hex(text) {
        const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text))
        return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, "0")).join("")
      }

      function show(id) {
        document.getElementById("scp-pass-form").classList.add("hidden")
        document.getElementById("scp-register-form").classList.add("hidden")
        document.getElementById("scp-phrase-form").classList.add("hidden")
        document.getElementById(id).classList.remove("hidden")
      }

      async function startCp() {
        const { openDb, bootAdmin } = await import("./js/peerya.js?v=scp15")
        await bootAdmin(null)
        if (!document.getElementById("scp-root")) throw new Error("Control panel did not start.")
        openDb().then((gdb) => bootAdmin(gdb)).catch((e) => {
          const main = document.getElementById("scp-main")
          if (main) main.innerHTML = "<h2>Dashboard</h2><p class=\"scp-empty\">" + String((e && e.message) || "Could not open GenosDB.") + "</p>"
        })
      }

      document.getElementById("scp-pass-form").addEventListener("submit", async (event) => {
        event.preventDefault()
        const err = document.getElementById("scp-pass-err")
        const input = document.getElementById("scp-pass")
        const hex = await sha256hex(input.value)
        if (hex !== ADMIN_PASS_HASH) {
          err.textContent = "Wrong passcode."
          input.value = ""
          input.focus()
          return
        }
        sessionStorage.setItem("peerya.scp", JSON.stringify({ t: Date.now() }))
        if (!canCreateSuperadmin()) {
          show("scp-phrase-form")
          document.getElementById("scp-phrase").focus()
          return
        }
        err.textContent = ""
        try {
          pending = await createSuperadmin()
          document.getElementById("scp-new-phrase").value = pending.mnemonic
          show("scp-register-form")
        } catch (e) {
          err.textContent = String((e && e.message) || "Could not create Superadmin.")
        }
      })

      document.getElementById("scp-copy-phrase").addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(document.getElementById("scp-new-phrase").value)
          document.getElementById("scp-register-err").style.color = "#5a7a2a"
          document.getElementById("scp-register-err").textContent = "Phrase copied. Keep it offline."
        } catch {
          document.getElementById("scp-register-err").style.color = "#c0392b"
          document.getElementById("scp-register-err").textContent = "Copy failed. Select the phrase and copy it."
        }
      })

      document.getElementById("scp-have-phrase").addEventListener("click", () => {
        show("scp-phrase-form")
        document.getElementById("scp-phrase").focus()
      })

      document.getElementById("scp-register-form").addEventListener("submit", async (event) => {
        event.preventDefault()
        const err = document.getElementById("scp-register-err")
        err.style.color = "#c0392b"
        if (!pending) {
          err.textContent = "Create the phrase first."
          return
        }
        if (!document.getElementById("scp-saved").checked) {
          err.textContent = "Confirm you saved the phrase."
          return
        }
        confirmSuperadmin(pending.address)
        err.style.color = "#5a7a2a"
        err.textContent = "Starting control panel…"
        try {
          await startCp()
        } catch (e) {
          err.style.color = "#c0392b"
          err.textContent = String((e && e.message) || "Could not start Superadmin.")
        }
      })

      document.getElementById("scp-phrase-form").addEventListener("submit", async (event) => {
        event.preventDefault()
        const err = document.getElementById("scp-phrase-err")
        const input = document.getElementById("scp-phrase")
        const btn = event.target.querySelector("button")
        err.textContent = ""
        btn.disabled = true
        input.disabled = true
        try {
          await unlockWithPhrase(input.value)
          err.style.color = "#5a7a2a"
          err.textContent = "Starting control panel…"
          await startCp()
        } catch (e) {
          err.style.color = "#c0392b"
          err.textContent = String((e && e.message) || "Could not unlock.")
          input.disabled = false
          btn.disabled = false
        }
      })
    </script>
  </body>
</html>
